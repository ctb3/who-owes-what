name: PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint

      # Catches a broken Dockerfile before it can reach main. No push, so this
      # needs no AWS credentials and is safe to run on fork pull requests.
      - run: docker build -t who-owes-what:pr .

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7

      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
